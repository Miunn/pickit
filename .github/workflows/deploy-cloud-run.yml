# Reusable Cloud Run deploy. Callers must use GitHub Environments
# `production` or `staging` with the vars/secrets listed below.
#
# Variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_RUN_SA (optional),
# NEXT_PUBLIC_APP_NAME, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SUPPORT_MAIL,
# NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, NEXT_PUBLIC_USER_MAP_ID,
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, NEXT_PUBLIC_PRICING_*, GCP_BUCKET_NAME,
# MAIL_HOST, MAIL_PORT, MAIL_SECURE, MAIL_SENDER, OAUTH_GOOGLE_CLIENT_ID
#
# Secrets: GCP_SA_KEY, DATABASE_URL, BETTER_AUTH_SECRET, AUTH_SECRET, CSRF_SECRET,
# MAIL_PASSWORD, MAIL_DKIM_PRIVATE_KEY, OAUTH_GOOGLE_CLIENT_SECRET,
# STRIPE_SECRET_KEY, STRIPE_SUBSCRIBE_WEBHOOK_SECRET

name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment_name:
        required: true
        type: string

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      SERVICE: ${{ inputs.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy && npx prisma generate

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$ARTIFACT_REPO" --location="$REGION" \
            || gcloud artifacts repositories create "$ARTIFACT_REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPPORT_MAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_MAIL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_USER_MAP_ID: ${{ vars.NEXT_PUBLIC_USER_MAP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_PRICING_FREE_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_FREE_MONTHLY }}
          NEXT_PUBLIC_PRICING_FREE_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_FREE_YEARLY }}
          NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY }}
          NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY }}
          NEXT_PUBLIC_PRICING_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_PRO_MONTHLY }}
          NEXT_PUBLIC_PRICING_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_PRO_YEARLY }}
          NEXT_PUBLIC_PRICING_BASIC_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_BASIC_MONTHLY }}
          NEXT_PUBLIC_PRICING_BASIC_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_BASIC_YEARLY }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --build-arg NEXT_PUBLIC_APP_NAME="$NEXT_PUBLIC_APP_NAME" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_SUPPORT_MAIL="$NEXT_PUBLIC_SUPPORT_MAIL" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
            --build-arg NEXT_PUBLIC_USER_MAP_ID="$NEXT_PUBLIC_USER_MAP_ID" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_PRICING_FREE_MONTHLY="$NEXT_PUBLIC_PRICING_FREE_MONTHLY" \
            --build-arg NEXT_PUBLIC_PRICING_FREE_YEARLY="$NEXT_PUBLIC_PRICING_FREE_YEARLY" \
            --build-arg NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY="$NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY" \
            --build-arg NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY="$NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY" \
            --build-arg NEXT_PUBLIC_PRICING_PRO_MONTHLY="$NEXT_PUBLIC_PRICING_PRO_MONTHLY" \
            --build-arg NEXT_PUBLIC_PRICING_PRO_YEARLY="$NEXT_PUBLIC_PRICING_PRO_YEARLY" \
            --build-arg NEXT_PUBLIC_PRICING_BASIC_MONTHLY="$NEXT_PUBLIC_PRICING_BASIC_MONTHLY" \
            --build-arg NEXT_PUBLIC_PRICING_BASIC_YEARLY="$NEXT_PUBLIC_PRICING_BASIC_YEARLY" \
            -t "$IMAGE" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:latest" \
            .
          docker push "$IMAGE"
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:latest"

      - name: Write Cloud Run env file
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPPORT_MAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_MAIL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_USER_MAP_ID: ${{ vars.NEXT_PUBLIC_USER_MAP_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_PRICING_FREE_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_FREE_MONTHLY }}
          NEXT_PUBLIC_PRICING_FREE_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_FREE_YEARLY }}
          NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY }}
          NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY }}
          NEXT_PUBLIC_PRICING_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_PRO_MONTHLY }}
          NEXT_PUBLIC_PRICING_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_PRO_YEARLY }}
          NEXT_PUBLIC_PRICING_BASIC_MONTHLY: ${{ vars.NEXT_PUBLIC_PRICING_BASIC_MONTHLY }}
          NEXT_PUBLIC_PRICING_BASIC_YEARLY: ${{ vars.NEXT_PUBLIC_PRICING_BASIC_YEARLY }}
          BETTER_AUTH_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
          FFMPEG_PATH: /usr/bin/ffmpeg
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_SECURE: ${{ vars.MAIL_SECURE }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DKIM_PRIVATE_KEY: ${{ secrets.MAIL_DKIM_PRIVATE_KEY }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_SUBSCRIBE_WEBHOOK_SECRET: ${{ secrets.STRIPE_SUBSCRIBE_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "NODE_ENV",
              "NEXT_PUBLIC_APP_NAME",
              "NEXT_PUBLIC_APP_URL",
              "NEXT_PUBLIC_SUPPORT_MAIL",
              "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY",
              "NEXT_PUBLIC_USER_MAP_ID",
              "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY",
              "NEXT_PUBLIC_PRICING_FREE_MONTHLY",
              "NEXT_PUBLIC_PRICING_FREE_YEARLY",
              "NEXT_PUBLIC_PRICING_EFFICIENT_MONTHLY",
              "NEXT_PUBLIC_PRICING_EFFICIENT_YEARLY",
              "NEXT_PUBLIC_PRICING_PRO_MONTHLY",
              "NEXT_PUBLIC_PRICING_PRO_YEARLY",
              "NEXT_PUBLIC_PRICING_BASIC_MONTHLY",
              "NEXT_PUBLIC_PRICING_BASIC_YEARLY",
              "BETTER_AUTH_URL",
              "GCP_PROJECT_ID",
              "GCP_BUCKET_NAME",
              "FFMPEG_PATH",
              "MAIL_HOST",
              "MAIL_PORT",
              "MAIL_SECURE",
              "MAIL_SENDER",
              "OAUTH_GOOGLE_CLIENT_ID",
              "DATABASE_URL",
              "BETTER_AUTH_SECRET",
              "AUTH_SECRET",
              "CSRF_SECRET",
              "MAIL_PASSWORD",
              "MAIL_DKIM_PRIVATE_KEY",
              "OAUTH_GOOGLE_CLIENT_SECRET",
              "STRIPE_SECRET_KEY",
              "STRIPE_SUBSCRIBE_WEBHOOK_SECRET",
          ]

          def yaml_value(value: str) -> str:
              if "\n" in value:
                  lines = "\n".join(f"  {line}" for line in value.splitlines())
                  return f"|\n{lines}"
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          lines = []
          for key in keys:
              value = os.environ.get(key)
              if value:
                  lines.append(f"{key}: {yaml_value(value)}")

          Path("cloudrun-env.yaml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Deploy to Cloud Run
        run: |
          EXTRA=()
          if [ -n "${{ vars.GCP_RUN_SA }}" ]; then
            EXTRA+=(--service-account="${{ vars.GCP_RUN_SA }}")
          fi
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --port=8080 \
            --cpu=2 \
            --memory=2Gi \
            --timeout=300 \
            --cpu-boost \
            --max-instances=10 \
            --allow-unauthenticated \
            --env-vars-file=cloudrun-env.yaml \
            "${EXTRA[@]}" \
            --quiet

      - name: Cleanup env file
        if: always()
        run: rm -f cloudrun-env.yaml
